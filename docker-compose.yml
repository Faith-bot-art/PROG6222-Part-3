version: '3.8'

services:
  raceday-api:
    image: raceday-api
    build:
      context: ./RaceDay.API
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=RaceDayDB;Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true

  raceday-mvc:
    image: raceday-mvc
    build:
      context: ./RaceDay.MVC
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://raceday-api:8080/api/
    depends_on:
      - raceday-api